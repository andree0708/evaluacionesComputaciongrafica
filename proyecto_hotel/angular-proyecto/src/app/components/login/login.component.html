<div class="login-container">
  <p-card class="login-card">
    <div class="login-content">
      <h2 class="login-title">Iniciar Sesión</h2>
      <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="nombreUsuario" class="form-label">Nombre de Usuario</label>
          <input 
            pInputText 
            id="nombreUsuario" 
            formControlName="nombreUsuario"
            placeholder="Ingresa tu nombre de usuario"
            class="form-input"
            [class.ng-invalid]="loginForm.get('nombreUsuario')?.invalid && loginForm.get('nombreUsuario')?.touched"
          />
          <small *ngIf="loginForm.get('nombreUsuario')?.invalid && loginForm.get('nombreUsuario')?.touched" 
                 class="error-message">
            El nombre de usuario es requerido
          </small>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <p-password 
            id="password" 
            formControlName="password"
            placeholder="Ingresa tu contraseña"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="form-input"
          ></p-password>
          <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" 
                 class="error-message">
            La contraseña es requerida
          </small>
        </div>

        <div *ngIf="errorMessage" class="error-container">
          <p-message severity="error" [text]="errorMessage"></p-message>
        </div>

        <p-button 
          label="Iniciar Sesión" 
          type="submit"
          [loading]="loading"
          [disabled]="loginForm.invalid || loading"
          styleClass="login-button"
        ></p-button>
      </form>

      <div class="login-footer">
        <p>
          ¿No tienes cuenta?
          <a routerLink="/register" class="link">Crea una nueva</a>
        </p>
        <p>
          ¿Solo quieres explorar?
          <a routerLink="/" class="link">Continuar como invitado</a>
        </p>
      </div>
    </div>
  </p-card>
</div>
