<div class="layout-container">
  <p-toast></p-toast>
  <div class="sidebar" [class.visible]="sidebarVisible">
    <div class="sidebar-content">
      <h2 style="color: white; margin-bottom: 2rem;">Menú</h2>
      <ul class="menu-list">
        <li>
          <a routerLink="/" (click)="sidebarVisible = false" class="menu-item">
            <i class="pi pi-home"></i> Inicio
          </a>
        </li>
        <li>
          <a routerLink="/habitaciones" (click)="sidebarVisible = false" class="menu-item">
            <i class="pi pi-building"></i> Habitaciones
          </a>
        </li>
        <li>
          <a routerLink="/servicios" (click)="sidebarVisible = false" class="menu-item">
            <i class="pi pi-star"></i> Servicios
          </a>
        </li>
        <li>
          <a routerLink="/contacto" (click)="sidebarVisible = false" class="menu-item">
            <i class="pi pi-phone"></i> Contáctanos
          </a>
        </li>
        <li *ngIf="!isAuthenticated()">
          <a routerLink="/login" (click)="sidebarVisible = false" class="menu-item">
            <i class="pi pi-sign-in"></i> Iniciar sesión
          </a>
        </li>
        <li *ngIf="!isAuthenticated()">
          <a routerLink="/register" (click)="sidebarVisible = false" class="menu-item">
            <i class="pi pi-user-plus"></i> Crear cuenta
          </a>
        </li>
        <li *ngIf="isClient()">
          <a routerLink="/reserva" (click)="sidebarVisible = false" class="menu-item">
            <i class="pi pi-calendar"></i> Mis reservas
          </a>
        </li>
        <li *ngIf="isAdmin()">
          <a routerLink="/admin" (click)="sidebarVisible = false" class="menu-item">
            <i class="pi pi-cog"></i> Administración
          </a>
        </li>
        <li *ngIf="isAuthenticated()">
          <a (click)="logout()" class="menu-item">
            <i class="pi pi-sign-out"></i> Cerrar Sesión
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="sidebar-overlay" [class.visible]="sidebarVisible" (click)="sidebarVisible = false"></div>

  <div class="main-content">
    <header class="header">
      <p-button icon="pi pi-bars" (onClick)="toggleSidebar()" [text]="true" [rounded]="true" styleClass="menu-button"></p-button>
      <h1 class="logo">Hotel Tropical</h1>
    </header>
    
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
